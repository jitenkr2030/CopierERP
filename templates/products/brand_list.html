{% extends "base.html" %}
{% block title %}Brands{% endblock %}
{% block content %}
<div class="d-flex justify-content-between mb-3">
  <h3><i class="bi bi-tags"></i> Brands</h3>
  <a href="{% url 'products:brand_create' %}" class="btn btn-primary"><i class="bi bi-plus-lg"></i> New</a>
</div>
<div class="card"><div class="card-body">
  <table class="table table-sm">
    <thead class="table-light"><tr><th>Name</th><th>Active</th><th>Actions</th></tr></thead>
    <tbody>{% for o in brands %}
      <tr><td>{{ o.name }}</td>
        <td>{{ o.is_active|yesno:"Yes,No" }}</td>
        <td><a href="{% url 'products:brand_edit' o.pk %}" class="btn btn-sm btn-outline-warning"><i class="bi bi-pencil"></i></a></td></tr>
    {% empty %}<tr><td colspan="4" class="text-muted text-center">No records</td></tr>{% endfor %}
    </tbody>
  </table>
</div></div>
{% endblock %}
