{% extends "base.html" %}
{% block title %}Category{% endblock %}
{% block content %}
<h3>{{ title|default:"Category" }}</h3>
<form method="post">{% csrf_token %}
  <div class="card mt-3"><div class="card-body">
    <div class="row g-3">
      {% for field in form %}
      <div class="col-md-6"><label class="form-label">{{ field.label }}</label>{{ field }}</div>
      {% endfor %}
    </div>
  </div></div>
  <div class="mt-3"><button class="btn btn-success">Save</button>
    <a href="{% url 'products:category_list' %}" class="btn btn-outline-secondary">Cancel</a></div>
</form>
{% endblock %}
