<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Copier Business ERP</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <style>body { background: linear-gradient(135deg, #1e3a5f, #2c5d8f); min-height: 100vh; }
  .login-card { max-width: 420px; margin: 8vh auto; }</style>
</head>
<body>
  <div class="container">
    <div class="login-card card shadow">
      <div class="card-body p-4">
        <div class="text-center mb-4">
          <i class="bi bi-printer-fill text-warning" style="font-size:3rem"></i>
          <h3 class="mt-2 mb-0">Copier Business <span class="text-warning">ERP</span></h3>
          <small class="text-muted">Sign in to your account</small>
        </div>
        <form method="post">
          {% csrf_token %}
          {% if form.non_field_errors %}
            <div class="alert alert-danger py-2 small">{{ form.non_field_errors }}</div>
          {% endif %}
          <div class="mb-3">
            <label class="form-label"><i class="bi bi-person"></i> Username</label>
            {{ form.username }}
          </div>
          <div class="mb-3">
            <label class="form-label"><i class="bi bi-lock"></i> Password</label>
            {{ form.password }}
          </div>
          <button type="submit" class="btn btn-primary w-100"><i class="bi bi-box-arrow-in-right"></i> Sign in</button>
        </form>
        <div class="text-center text-muted mt-3 small">
          Default demo user: <strong>admin / admin123</strong>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
