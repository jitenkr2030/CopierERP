{% extends "base.html" %}
{% block title %}Expense Categories{% endblock %}
{% block content %}
<div class="d-flex justify-content-between mb-3">
  <h3><i class="bi bi-tags"></i> Expense Categories</h3>
  <a href="{% url 'expenses:category_create' %}" class="btn btn-primary"><i class="bi bi-plus-lg"></i> New</a>
</div>
<div class="card"><div class="card-body">
  <table class="table table-sm">
    <thead class="table-light"><tr><th>Name</th><th>Active</th></tr></thead>
    <tbody>{% for c in categories %}
      <tr><td>{{ c.name }}</td><td>{{ c.is_active|yesno:"Yes,No" }}</td></tr>
    {% empty %}<tr><td colspan="2" class="text-muted text-center">No categories</td></tr>{% endfor %}
    </tbody>
  </table>
</div></div>
{% endblock %}
