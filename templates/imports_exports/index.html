{% extends "base.html" %}
{% block title %}Import / Export{% endblock %}
{% block content %}
<h3><i class="bi bi-arrow-left-right"></i> Import / Export</h3>
<div class="row g-3">
  <div class="col-md-6"><div class="card"><div class="card-body">
    <h5>Export</h5>
    <a href="{% url 'imports_exports:export' 'companies' %}" class="btn btn-outline-success btn-sm m-1">Companies</a>
    <a href="{% url 'imports_exports:export' 'products' %}" class="btn btn-outline-success btn-sm m-1">Products</a>
    <a href="{% url 'imports_exports:export' 'purchases' %}" class="btn btn-outline-success btn-sm m-1">Purchases</a>
    <a href="{% url 'imports_exports:export' 'sales' %}" class="btn btn-outline-success btn-sm m-1">Sales</a>
  </div></div></div>
  <div class="col-md-6"><div class="card"><div class="card-body">
    <h5>Import</h5>
    <a href="{% url 'imports_exports:import_companies' %}" class="btn btn-outline-primary btn-sm m-1">Companies</a>
    <a href="{% url 'imports_exports:import_products' %}" class="btn btn-outline-primary btn-sm m-1">Products</a>
  </div></div></div>
  <div class="col-md-6"><div class="card"><div class="card-body">
    <h5>Sample templates</h5>
    <a href="{% url 'imports_exports:template' 'companies' %}" class="btn btn-outline-info btn-sm m-1">Companies template</a>
    <a href="{% url 'imports_exports:template' 'products' %}" class="btn btn-outline-info btn-sm m-1">Products template</a>
  </div></div></div>
</div>
{% endblock %}
