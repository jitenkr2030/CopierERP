{% extends "base.html" %}
{% block title %}My Profile{% endblock %}
{% block content %}
<h3><i class="bi bi-person-circle"></i> My Profile</h3>
<form method="post" enctype="multipart/form-data">
  {% csrf_token %}
  <div class="card mt-3"><div class="card-body">
    <div class="row g-3">
      <div class="col-md-6"><label class="form-label">First name</label>{{ form.first_name }}</div>
      <div class="col-md-6"><label class="form-label">Last name</label>{{ form.last_name }}</div>
      <div class="col-md-6"><label class="form-label">Email</label>{{ form.email }}</div>
      <div class="col-md-6"><label class="form-label">Phone</label>{{ form.phone }}</div>
      <div class="col-md-12"><label class="form-label">Avatar</label>{{ form.avatar }}</div>
    </div>
  </div></div>
  <div class="mt-3"><button class="btn btn-success"><i class="bi bi-check-lg"></i> Update</button></div>
</form>
{% endblock %}
