{% extends "base.html" %}
{% block title %}{{ title|default:"Calls" }} - Copier ERP{% endblock %}
{% block content %}
<div class="d-flex justify-content-between align-items-center mb-3">
  <h3><i class="bi bi-pencil"></i> {{ title|default:"Calls" }}</h3>
</div>
<form method="post" enctype="multipart/form-data">
  {% csrf_token %}
  <div class="card"><div class="card-body">
    <div class="row g-3">
      {% for field in form %}
      <div class="col-md-{% if 'notes' in field.name or 'description' in field.name or 'address' in field.name %}12{% elif 'file' in field.field.widget.input_type|default:'' or 'clearable' in field.field.widget|default:''|slice:':8' %}12{% else %}4{% endif %}">
        <label class="form-label">{{ field.label }}{% if field.field.required %} <span class="text-danger">*</span>{% endif %}</label>
        {{ field }}
        {% if field.errors %}<div class="text-danger small">{{ field.errors }}</div>{% endif %}
      </div>
      {% endfor %}
    </div>
  </div></div>

  <div class="mt-3">
    <button type="submit" class="btn btn-success"><i class="bi bi-check-lg"></i> Save</button>
    <a href="{% url 'expenses:expense_list' %}" class="btn btn-outline-secondary">Cancel</a>
  </div>
</form>
{% endblock %}
